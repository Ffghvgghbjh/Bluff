<!DOCTYPE html>
<html lang="ka"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d0e">
<title>BLUFF</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&family=Noto+Serif+Georgian:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080d0e;--s1:#0f1718;--s2:#152123;--s3:#1c2c2e;--line:#2a3d3d;--gold:#e3b75f;--gold2:#9c7a31;--ruby:#e5493f;--ink:#efe6d2;--mute:#93a69e;--ok:#5fcf9a;
--sans:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Noto Serif Georgian",Georgia,serif;
color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;color:var(--ink);font:16px/1.5 var(--sans);overflow-x:hidden;
background:radial-gradient(900px 480px at 50% -8%,rgba(227,183,95,.17),transparent 62%),radial-gradient(ellipse at 50% 125%,rgba(229,73,63,.09),transparent 60%),var(--bg);background-attachment:fixed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--gold);color:#1b1407;padding:8px 14px;border-radius:8px;z-index:50}.skip:focus{top:8px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:880px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 6px}
.brand{font:900 1.15rem var(--serif);color:var(--gold);letter-spacing:.04em;background:none;border:0;cursor:pointer;padding:6px 2px}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mute);font:700 .8rem var(--sans);min-width:44px;min-height:36px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--gold);color:#1b1407}
main{max-width:880px;margin:0 auto;padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.view[hidden]{display:none}
h1,h2,h3{margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
.btn{min-height:48px;padding:0 22px;border-radius:999px;font:700 1rem var(--sans);border:1.5px solid var(--line);background:var(--s2);color:var(--ink);cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
.btn:hover:not(:disabled){border-color:var(--gold)}.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,#f2cb78,#d3a443);color:#1b1407;border-color:transparent}
.btn.pri:hover:not(:disabled){filter:brightness(1.07)}
.btn.bad{border-color:var(--ruby);color:#ff9a92}.btn.bad:hover:not(:disabled){background:rgba(229,73,63,.14)}
.btn.sel{background:var(--gold);color:#1b1407;border-color:var(--gold)}
.btn.big{min-height:56px;font-size:1.1rem;width:100%}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;text-underline-offset:4px;cursor:pointer;font:600 .95rem var(--sans);min-height:44px;padding:0 8px}
.link:hover{color:var(--gold)}
.inp{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--s2);color:var(--ink);padding:0 16px;font:inherit;width:100%}
.inp.code::placeholder{letter-spacing:0;text-transform:none;font-weight:400}.inp.code{text-transform:uppercase;letter-spacing:.2em;text-align:center;font-weight:800}
.panel{background:linear-gradient(180deg,var(--s1),#0c1314);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 18px 50px -20px rgba(0,0,0,.8)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{color:#ff9a92;min-height:1.5em;margin:10px 0 0;font-weight:600}
/* home */
.hero{text-align:center;padding:10px 0 8px}
#fan{display:flex;justify-content:center;height:clamp(190px,50vw,270px);margin:6px 0 16px}
#fan img{width:clamp(88px,26vw,128px);aspect-ratio:2/3;object-fit:cover;border-radius:10px;margin:0 clamp(-30px,-5vw,-18px);border:2px solid var(--gold);box-shadow:0 14px 26px rgba(0,0,0,.6);transform-origin:50% 130%;animation:fan .7s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes fan{from{transform:rotate(0) translateY(30px);opacity:0}}
h1#title{font:900 clamp(2.6rem,12vw,4.4rem)/1.25 var(--serif);color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.5)}
.tag{margin:2px 0 0;color:var(--mute);font-style:italic}
.joinp{max-width:440px;margin:18px auto 0}
.joinp>*+*{margin-top:12px}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:.85rem}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.sub{text-align:center;color:var(--mute);font-size:.9rem;margin:16px 0 0}
.center{text-align:center}
/* lobby */
.lob{max-width:520px;margin:10px auto 0}
.codebox{margin:10px 0 14px;text-align:center;border:1.5px dashed var(--gold2);border-radius:18px;padding:14px}
.codebox b{font:900 clamp(2.2rem,10vw,3.2rem) var(--serif);letter-spacing:.18em;color:var(--gold)}
.plist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.plist li{display:flex;align-items:center;gap:12px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;color:#fff;flex:none;border:2px solid rgba(255,255,255,.18)}
.tagc{margin-left:auto;font-size:.72rem;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.stepper{display:flex;align-items:center;gap:12px;margin-top:6px}
.stepper output{min-width:2ch;text-align:center;font-weight:800;font-size:1.3rem}
.stepper .btn{min-width:48px;padding:0}
/* game */
#tb{text-align:center;font-weight:800;margin:4px 0 8px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);color:var(--mute)}
#tb.me{border-color:var(--gold);color:var(--gold);box-shadow:0 0 22px -6px var(--gold)}
#game{position:relative}
#tbl{position:relative;aspect-ratio:1/1.3;max-height:720px;margin:0 auto}
#tbl::before{content:'';position:absolute;inset:9% 3% 11%;border-radius:50%;background:radial-gradient(ellipse at 50% 36%,#1d3b36 0,#112721 55%,#0a1614 100%);border:6px solid #7d6027;box-shadow:inset 0 0 60px rgba(0,0,0,.75),0 0 0 2px var(--gold2),0 20px 44px rgba(0,0,0,.6)}
.seat{--cw:clamp(30px,9vw,46px);position:absolute;transform:translate(-50%,-50%);width:clamp(84px,24%,142px);text-align:center;padding:7px 5px 8px;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:16px;z-index:1;transition:box-shadow .3s,border-color .3s}
.seat.me{--cw:clamp(52px,15vw,92px);width:clamp(140px,40%,270px);transform:translate(-50%,-100%)}
.seat.cur{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 28px -4px var(--gold)}
.seat.out{opacity:.45}.seat.off .sh b::after{content:' ⚠';color:var(--ruby)}
.sh{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.av.meav{border-color:var(--gold)}.sh .av{width:22px;height:22px;font-size:.7rem}.seat.me .sh .av{width:28px;height:28px;font-size:.85rem}
.sh b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
.co{display:inline-flex;align-items:center;margin-top:3px}
.co i{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2b0,#d6a62e 55%,#8a6410);border:1px solid #6b4c0c;margin-right:-6px}
.co em{font-style:normal;font-weight:800;color:var(--gold);margin-left:11px;font-size:.9rem}
.cs{display:flex;justify-content:center;gap:4px;margin-top:6px}
.cd{width:var(--cw);aspect-ratio:2/3;border-radius:8px;border:2px solid var(--gold);background:var(--s2);box-shadow:0 5px 12px rgba(0,0,0,.55);overflow:hidden;position:relative;transition:transform .2s}
.cd img{width:100%;height:100%;object-fit:cover;display:block}
.cd.back{background:linear-gradient(45deg,transparent 45%,var(--gold) 46%,var(--gold) 54%,transparent 55%),linear-gradient(-45deg,transparent 45%,var(--gold) 46%,var(--gold) 54%,transparent 55%),var(--ruby);background-size:16px 16px}
.cd.dead{opacity:.5;filter:grayscale(1)}.cd.dead::after{content:'✖';position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;color:#fff;text-shadow:0 0 6px #000}
.seat.me .cd:hover:not(.dead){transform:translateY(-8px)}
.bub{position:absolute;right:-6px;top:-18px;font-size:1.8rem;animation:pop .35s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
@keyframes pop{from{transform:scale(.2);opacity:0}}
#ctr{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:38%;text-align:center;font-size:.82rem;line-height:1.35}
#ctr .em{font-size:2.3rem;line-height:1;margin-bottom:4px}#ctr small{display:block;color:var(--mute);font-size:.7rem;margin-top:4px}
#emo{display:flex;justify-content:center;gap:8px;margin:10px 0 2px}
#emo button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--s2);font-size:1.3rem;cursor:pointer;transition:transform .12s}
#emo button:hover{border-color:var(--gold)}#emo button:active{transform:scale(.88)}
#tmr{display:flex;align-items:center;gap:10px;margin-top:10px}#tmr:empty{display:none}
.tm{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.tm i{display:block;height:100%;background:var(--gold);transform-origin:left;animation:tm linear forwards}
@keyframes tm{from{transform:scaleX(1)}to{transform:scaleX(0);background:var(--ruby)}}
#tmr output{font-weight:800;min-width:3.4ch;text-align:right}
#act{margin-top:10px;padding:16px;min-height:84px;background:var(--s1);border:1.5px solid var(--gold2);border-radius:20px}
#act.hot{border-color:var(--ruby);animation:hot 1.1s ease-in-out infinite}
@keyframes hot{50%{box-shadow:0 0 24px -2px var(--ruby)}}
#act .qt{margin:0 0 12px;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opts .btn{border-radius:14px;text-align:left;padding:10px 16px}
.wait{color:var(--mute);margin:0}
#ref{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 6px;margin-top:4px;scrollbar-width:thin}
#ref div{flex:0 0 92px;text-align:center;font-size:.68rem;line-height:1.3;color:var(--mute)}
#ref img{width:70px;aspect-ratio:2/3;object-fit:cover;border-radius:7px;border:1.5px solid var(--gold);display:block;margin:0 auto 4px}
.logh{margin:16px 0 6px;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
#log{list-style:none;margin:0;padding:0;max-height:210px;overflow:auto;font-size:.92rem}
#log li{border-bottom:1px dashed var(--line);padding:4px 0 4px 8px;color:var(--mute)}
#log li:first-child{color:var(--ink);font-weight:600}
#log li.r{border-left:3px solid var(--ruby)}#log li.k{border-left:3px solid var(--gold)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(4,7,8,.92);overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
.ov[hidden]{display:none}
#rv img{width:min(46%,190px);aspect-ratio:2/3;object-fit:cover;border-radius:12px;border:3px solid var(--gold);animation:flip .6s ease-out;box-shadow:0 0 44px -4px var(--gold)}
#rv.no img{border-color:var(--ruby);filter:grayscale(.7);box-shadow:0 0 44px -4px var(--ruby)}
#rv h2,#end h2{font:900 clamp(1.8rem,8vw,2.8rem) var(--serif);color:var(--gold)}#rv.no h2{color:var(--ruby)}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}}
#end .crown{font-size:4rem;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--s1);border:1px solid var(--gold2);border-radius:22px;max-width:560px;width:100%;max-height:88dvh;overflow:auto;padding:22px}
.sheet h2{font:900 1.5rem var(--serif);color:var(--gold);margin-bottom:10px}.sheet h3{margin:16px 0 6px;font-size:1rem;color:var(--gold)}.sheet p{margin:8px 0}
.rl{list-style:none;padding:0;margin:0;display:grid;gap:10px}.rl li{display:flex;gap:12px;align-items:center}
.rl img{width:46px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;border:1.5px solid var(--gold);flex:none}.rl span{display:block;color:var(--mute);font-size:.88rem}
dl{margin:0;display:grid;gap:8px}dt{font-weight:700}dd{margin:0 0 4px;color:var(--mute);font-size:.9rem}
#conn{position:sticky;top:0;z-index:40;background:var(--ruby);color:#fff;text-align:center;padding:6px;font-weight:700}
#conn[hidden]{display:none}
@media(max-width:600px){#tbl{aspect-ratio:1/1.62}.seat{width:clamp(80px,22%,140px)}.seat.me{width:clamp(130px,38%,260px)}#ctr{width:36%;font-size:.74rem;top:46%}#ctr small{display:none}#ctr .em{font-size:1.9rem}.opts{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body>
<a class="skip" href="#main" data-i="skip">Skip</a>
<div id="conn" hidden role="status" data-i="conn"></div>
<header class="top">
  <button class="brand" id="brand" data-i="name" aria-label="Home"></button>
  <div class="tools">
    <button class="link" id="howto" data-i="howto"></button>
    <div class="seg" role="group" aria-label="Language"><button id="lka" aria-pressed="false">KA</button><button id="len" aria-pressed="false">EN</button></div>
  </div>
</header>
<main id="main">
<noscript>This game needs JavaScript.</noscript>

<section id="home" class="view">
  <div class="hero">
    <div id="fan" aria-hidden="true"></div>
    <h1 id="title" data-i="name" tabindex="-1" data-focus></h1>
    <p class="tag" data-i="tagline"></p>
  </div>
  <div class="panel joinp">
    <label class="sr" for="nick" data-i="nick"></label>
    <input id="nick" class="inp" maxlength="12" autocomplete="nickname" data-ph="nick">
    <button id="mk" class="btn pri big" data-i="create"></button>
    <div class="or"><span data-i="orjoin"></span></div>
    <div class="row"><label class="sr" for="code" data-i="code"></label><input id="code" class="inp code" maxlength="8" autocapitalize="characters" autocomplete="off" data-ph="code" style="flex:1;width:auto"><button id="jn" class="btn" data-i="join"></button></div>
    <p id="msg" class="msg" role="alert"></p>
  </div>
  <p class="sub" data-i="sub"></p>
</section>

<section id="lobby" class="view lob" hidden>
  <div class="panel">
    <h2 data-i="roomcode" tabindex="-1" data-focus style="font-size:1rem;color:var(--mute);text-align:center"></h2>
    <div class="codebox"><b id="rc"></b></div>
    <div class="row" style="justify-content:center"><button id="cp" class="btn pri"></button><button id="sh" class="btn" hidden data-i="share"></button></div>
    <h3 style="margin-top:20px" data-i="players"></h3>
    <ul id="plist" class="plist"></ul>
    <div id="hostctl" style="margin-top:18px">
      <h3 data-i="bots"></h3>
      <div class="stepper"><button id="bm" class="btn" aria-label="−">−</button><output id="bn" aria-live="polite"></output><button id="bp" class="btn" aria-label="+">+</button><span id="tot" style="margin-left:auto;color:var(--mute)"></span></div>
      <button id="go" class="btn pri big" style="margin-top:16px" data-i="start"></button>
      <p id="hint" class="wait center" style="margin-top:8px"></p>
    </div>
    <p id="waitH" class="wait center" data-i="waithost" style="margin-top:18px"></p>
    <p class="center" style="margin:10px 0 0"><button id="lv" class="link" data-i="leave"></button></p>
  </div>
</section>

<section id="game" class="view" hidden>
  <div id="tb" aria-live="polite"></div>
  <div id="tbl"></div>
  <div id="emo" role="group" data-al="emotes"></div>
  <div id="tmr"></div>
  <div id="act" aria-live="polite" tabindex="-1"></div>
  <div id="ref" aria-hidden="true"></div>
  <h3 class="logh" data-i="logh"></h3>
  <ol id="log" role="log" aria-live="off"></ol>
  <div id="rv" class="ov" hidden role="status"></div>
  <div id="end" class="ov" hidden role="dialog" aria-modal="true" aria-labelledby="endt"></div>
</section>
</main>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="sheet"><h2 id="mt"></h2><div id="mb"></div><button id="mc" class="btn big" style="margin-top:18px" data-i="close"></button></div>
</div>

function conn(){

function render(){
 const me=V.p[V.me];
 if(cur&&V.a!==cur){cur=0;clearAsk()}

const q=new URLSearchParams(location.search).get('r');if(q)$('#code').value=q.slice(0,8);

applyLang();conn();
